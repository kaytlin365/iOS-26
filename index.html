<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iOS 26 • Liquid Glass Home Screen</title>
  <style>
    :root {
      color-scheme: only light;
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-blur: blur(25px);
      --dock-blur: blur(20px) saturate(180%);
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.7);
      --icon-size: clamp(62px, 8.5vw, 82px);
      --grid-gap: clamp(14px, 2.2vw, 22px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SF Pro Display", "Helvetica Neue", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #0a0b10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      overflow: hidden;
    }

    .home-screen {
      position: relative;
      width: min(420px, 100vw);
      height: 100vh;
      padding: 22px 16px 26px;
      overflow: hidden;
      border-radius: 32px;
      isolation: isolate;
    }

    .wallpaper {
      position: absolute;
      inset: -10% -10% -10% -10%;
      background:
        radial-gradient(circle at 20% 20%, rgba(113, 187, 255, 0.6), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(194, 158, 255, 0.45), transparent 50%),
        radial-gradient(circle at 60% 80%, rgba(255, 173, 107, 0.4), transparent 50%),
        radial-gradient(circle at 40% 60%, rgba(123, 255, 246, 0.3), transparent 55%);
      filter: saturate(130%);
      animation: breathe 14s ease-in-out infinite;
      transform: translate3d(var(--parallax-x, 0px), var(--parallax-y, 0px), 0);
      transition: transform 0.2s ease-out;
      z-index: 0;
    }

    .wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 90%, rgba(120, 140, 255, 0.35), transparent 50%),
        radial-gradient(circle at 90% 10%, rgba(255, 214, 149, 0.35), transparent 45%);
      mix-blend-mode: screen;
      opacity: 0.7;
      animation: shimmer 9s ease-in-out infinite alternate;
      transform: translate3d(calc(var(--parallax-x, 0px) * -0.4), calc(var(--parallax-y, 0px) * -0.4), 0);
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(1) translate3d(var(--parallax-x, 0px), var(--parallax-y, 0px), 0);
      }
      50% {
        transform: scale(1.05) translate3d(calc(var(--parallax-x, 0px) * 1.2), calc(var(--parallax-y, 0px) * 1.2), 0);
      }
    }

    @keyframes shimmer {
      0% {
        opacity: 0.55;
      }
      100% {
        opacity: 0.9;
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 14, 25, 0.35);
      backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 3;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-content {
      position: absolute;
      inset: 14% 8% 30%;
      padding: 24px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      backdrop-filter: var(--glass-blur);
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--text-secondary);
    }

    .overlay-content h2 {
      font-size: 20px;
      color: var(--text-primary);
    }

    .status-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
    }

    .battery-cell {
      width: 16px;
      height: 8px;
      border-radius: 2px;
      background: linear-gradient(90deg, #7dffcc, #82b9ff);
    }

    .dynamic-island {
      margin: 8px auto 18px;
      width: 140px;
      height: 34px;
      border-radius: 999px;
      background: rgba(15, 16, 28, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
      z-index: 2;
      cursor: pointer;
    }

    .dynamic-island::after {
      content: "";
      position: absolute;
      inset: -40% 15% 40% 15%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.4), transparent 70%);
      opacity: 0.4;
      transform: translateX(-40%);
      transition: transform 0.4s ease;
    }

    .dynamic-island.expanded {
      width: min(320px, 90%);
      height: 78px;
      background: rgba(17, 22, 40, 0.75);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .dynamic-island.expanded::after {
      transform: translateX(30%);
      opacity: 0.7;
    }

    .dynamic-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.35s ease;
    }

    .dynamic-island.expanded .dynamic-content {
      transform: scale(1.05);
    }

    .icons-grid {
      position: relative;
      z-index: 2;
      margin-top: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--grid-gap);
      padding: 10px 8px 0;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .app-icon:active {
      transform: scale(0.95);
    }

    .icon-tile {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 22%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      position: relative;
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 16px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .icon-tile::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 20%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      opacity: 0.6;
    }

    .icon-glyph {
      width: 60%;
      height: 60%;
      opacity: 0.85;
    }

    .icon-label {
      text-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .search-pill {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 120px;
      width: min(220px, 80%);
      height: 34px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--glass-blur);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-secondary);
      z-index: 2;
      cursor: pointer;
    }

    .dock {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;
      width: min(360px, 92%);
      height: 84px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      backdrop-filter: var(--dock-blur);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      place-items: center;
      padding: 10px 12px;
      gap: 6px;
      z-index: 2;
      box-shadow: 0 20px 45px rgba(8, 10, 24, 0.45);
    }

    .dock .icon-tile {
      width: clamp(56px, 12vw, 70px);
      height: clamp(56px, 12vw, 70px);
      border-radius: 24%;
      background: rgba(255, 255, 255, 0.2);
    }

    .dock .app-icon {
      font-size: 0;
    }

    @media (max-width: 420px) {
      .home-screen {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="home-screen">
    <div class="wallpaper" aria-hidden="true"></div>

    <header class="status-bar">
      <div id="time">9:41</div>
      <div class="status-icons">
        <span>Wi-Fi</span>
        <span>5G</span>
        <div class="battery">
          <div class="battery-cell"></div>
          <span>92%</span>
        </div>
      </div>
    </header>

    <div class="dynamic-island" id="dynamicIsland">
      <div class="dynamic-content">
        <strong>Now Playing</strong>
        <span>Solarium Pulse</span>
      </div>
    </div>

    <section class="icons-grid">
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="18" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
            <path d="M32 14v36" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <span class="icon-label">Clock</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <rect x="14" y="18" width="36" height="28" rx="8" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
            <path d="M20 34h24" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <span class="icon-label">Notes</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M20 44l24-24" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" />
            <circle cx="24" cy="24" r="6" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
            <circle cx="40" cy="40" r="6" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
          </svg>
        </div>
        <span class="icon-label">Health</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M16 40c6-12 26-12 32 0" stroke="rgba(255,255,255,0.75)" stroke-width="4" stroke-linecap="round" />
            <path d="M20 24h24" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <span class="icon-label">Weather</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <rect x="16" y="14" width="32" height="36" rx="8" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
            <path d="M24 26h16M24 34h16" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <span class="icon-label">Mail</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M18 30h28" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
            <circle cx="32" cy="32" r="14" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
          </svg>
        </div>
        <span class="icon-label">Camera</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M22 42l6-20 6 20 6-20 6 20" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <span class="icon-label">Stocks</span>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M20 42h24" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
            <path d="M24 22h16" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
            <path d="M32 22v20" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <span class="icon-label">Remind</span>
      </div>
    </section>

    <div class="search-pill" id="searchPill">
      <span>Search</span>
      <span>⌕</span>
    </div>

    <nav class="dock">
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M24 18c6 12 10 16 22 22" stroke="rgba(255,255,255,0.8)" stroke-width="4" stroke-linecap="round" />
            <rect x="18" y="14" width="28" height="36" rx="10" stroke="rgba(255,255,255,0.6)" stroke-width="4" />
          </svg>
        </div>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="18" stroke="rgba(255,255,255,0.7)" stroke-width="4" />
            <path d="M32 14v36" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
            <path d="M14 32h36" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <rect x="14" y="20" width="36" height="24" rx="10" stroke="rgba(255,255,255,0.7)" stroke-width="4" />
            <circle cx="24" cy="32" r="4" fill="rgba(255,255,255,0.7)" />
            <circle cx="32" cy="32" r="4" fill="rgba(255,255,255,0.7)" />
            <circle cx="40" cy="32" r="4" fill="rgba(255,255,255,0.7)" />
          </svg>
        </div>
      </div>
      <div class="app-icon">
        <div class="icon-tile">
          <svg class="icon-glyph" viewBox="0 0 64 64" fill="none">
            <path d="M24 18v28" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" />
            <path d="M40 18v28" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round" />
            <rect x="20" y="18" width="24" height="28" rx="8" stroke="rgba(255,255,255,0.7)" stroke-width="4" />
          </svg>
        </div>
      </div>
    </nav>

    <div class="overlay" id="searchOverlay">
      <div class="overlay-content">
        <h2>Search</h2>
        <p>Liquid Glass results hover just beneath the surface.</p>
        <p>Tap anywhere to dismiss.</p>
      </div>
    </div>
  </main>

  <script>
    const timeEl = document.getElementById("time");
    const dynamicIsland = document.getElementById("dynamicIsland");
    const searchPill = document.getElementById("searchPill");
    const searchOverlay = document.getElementById("searchOverlay");
    const homeScreen = document.querySelector(".home-screen");

    const updateTime = () => {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const formatted = `${hours % 12 || 12}:${minutes.toString().padStart(2, "0")}`;
      timeEl.textContent = formatted;
    };

    updateTime();
    setInterval(updateTime, 1000);

    const toggleIsland = () => {
      dynamicIsland.classList.toggle("expanded");
    };

    dynamicIsland.addEventListener("click", toggleIsland);
    dynamicIsland.addEventListener("mouseenter", () => dynamicIsland.classList.add("expanded"));
    dynamicIsland.addEventListener("mouseleave", () => dynamicIsland.classList.remove("expanded"));

    searchPill.addEventListener("click", () => {
      searchOverlay.classList.add("active");
    });

    searchOverlay.addEventListener("click", () => {
      searchOverlay.classList.remove("active");
    });

    const parallaxStrength = 12;
    homeScreen.addEventListener("mousemove", (event) => {
      const rect = homeScreen.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width - 0.5) * parallaxStrength;
      const y = ((event.clientY - rect.top) / rect.height - 0.5) * parallaxStrength;
      homeScreen.style.setProperty("--parallax-x", `${x}px`);
      homeScreen.style.setProperty("--parallax-y", `${y}px`);
    });

    homeScreen.addEventListener("mouseleave", () => {
      homeScreen.style.setProperty("--parallax-x", "0px");
      homeScreen.style.setProperty("--parallax-y", "0px");
    });
  </script>
</body>
</html>
